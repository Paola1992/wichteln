<style>
:root{
  --bg:#1e1d45; --bg2:#2a2960; --card:#ffffff; --ink:#1b1b2f; --muted:#5d5d78;
  --red:#c9313f; --red-d:#a92633; --green:#3f8b73; --gold:#f2c14e; --line:#e4e4ee;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 50% -200px,#3b3a86 0%,var(--bg) 60%) fixed,var(--bg);
  color:#fff; font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:19px; line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
}
.snow{position:fixed;inset:0;pointer-events:none;background-image:
  radial-gradient(2px 2px at 20px 30px,#fff8,transparent),radial-gradient(2px 2px at 140px 80px,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 90px 160px,#fff7,transparent),radial-gradient(2px 2px at 220px 120px,#fff5,transparent);
  background-size:260px 200px;opacity:.6}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 64px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.brand{font-family:"Mountains of Christmas",cursive;font-size:30px;line-height:1.1;margin:0}
.langbar{background:#ffffff14;border:1px solid #ffffff2a;border-radius:16px;padding:10px 12px;margin:0 0 6px}
.langbar .lt{display:block;font-size:16px;color:#e4e4f7;margin:0 0 8px;font-weight:600}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{background:transparent;border:2px solid #ffffff55;color:#fff;border-radius:12px;padding:10px 8px;font:inherit;font-size:19px;font-weight:700;cursor:pointer;min-height:52px}
.langs button.on{background:#fff;color:var(--ink);border-color:#fff}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-size:19px}
.steps li::before{content:counter(st);flex:0 0 34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ok-box{background:#e3f3ed;color:#1f5444;border-radius:var(--radius);padding:18px;margin:12px 0;font-size:20px}
.msgbox{white-space:pre-wrap;background:#f4f4f9;border-radius:10px;padding:10px 12px;font-size:15px;max-height:220px;overflow:auto;margin:8px 0}
h2{font-size:21px;margin:26px 4px 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:#ffffff2a}
.card{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:18px;margin:12px 0;box-shadow:0 6px 20px #0003}
.card .label{color:var(--red);font-weight:600;font-size:16px;margin:0 0 2px}
.card .value{font-weight:800;font-size:22px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.hello{font-size:28px;font-weight:800;margin:8px 4px 0}
.sub{color:#d9d9f0;margin:4px 4px 0}
.muted{color:var(--muted)}
.small{font-size:15px}
label.f{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=date],textarea,select{
  width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green)}
textarea{min-height:110px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;
  font:inherit;font-weight:800;font-size:18px;padding:14px 22px;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;min-height:52px}
.btn:hover{background:var(--red-d)}
.btn.block{width:100%;margin-top:14px}
.btn.green{background:var(--green)} .btn.green:hover{background:#357562}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{background:#f4f4f9}
.btn.sm{font-size:15px;padding:8px 14px;min-height:40px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reveal{text-align:center;padding:28px 18px}
.gift{font-size:90px;line-height:1;cursor:pointer;display:inline-block;transition:transform .2s;user-select:none;border:0;background:none;padding:0}
.gift:hover{transform:scale(1.06) rotate(-4deg)}
.gift.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.receiver{font-family:"Mountains of Christmas",cursive;font-size:52px;color:var(--red);margin:6px 0 4px;line-height:1.1;word-break:break-word}
.wishbox{background:#fbf6e9;border-radius:12px;padding:12px 14px;margin-top:12px;text-align:left;white-space:pre-wrap;word-break:break-word}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:#eef0ff;color:#3b3a86}
.pill.team{background:#fde8ea;color:var(--red-d)}
.pill.ok{background:#e3f3ed;color:#2b6d58}
.p{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0}
.p:first-of-type{border-top:0}
.p .name{font-weight:800;font-size:19px}
.p .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.p .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{border:2px solid var(--line);background:#fff;border-radius:12px;min-width:42px;height:42px;font-size:19px;cursor:pointer;color:var(--ink);padding:0 10px}
.iconbtn:hover{background:#f4f4f9}
.notice{background:#fff4d6;color:#5b4300;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px}
.notice.err{background:#fde8ea;color:#8a1c27}
.status{background:#000;color:#fff;text-align:center;padding:8px;border-radius:12px;font-weight:600;margin:8px 0}
.status.done{background:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details summary{cursor:pointer;font-weight:700}
.center{text-align:center}
.big{font-size:22px}
.edit{display:grid;gap:8px;margin-top:10px;background:#f7f7fb;border-radius:12px;padding:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.receiver{font-size:42px}.brand{font-size:26px}}
</style>

let lang = store.get('lang') || ((navigator.language||'').toLowerCase().startsWith('es') ? 'es' : 'de');

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = () => location.origin + location.pathname;

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{ apikey:SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args)
  });
  const txt = await r.text();
  if (!r.ok){
    let m = 'error'; try { m = JSON.parse(txt).message || m; } catch {}
    const e = new Error(m); e.code = m; throw e;
  }
  return txt ? JSON.parse(txt) : null;
}
function errText(e){
  const map = { not_found:'notFound', name_taken:'nameTaken', name_required:'nameRequired', already_drawn:'alreadyDrawn', already_claimed:'alreadyClaimed', too_few:'tooFew', impossible:'impossible' };
  return t()[map[e.code]] || t().error;
}
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t().copied);
}
async function shareText(text, url){
  if (navigator.share){ try { await navigator.share({ text }); return; } catch(e){ if (e.name === 'AbortError') return; } }
  copy(text);
}
function fmtDate(d){
  if (!d) return '–';
  const [y,m,day] = d.split('-').map(Number);
  return new Date(y, m-1, day).toLocaleDateString(lang === 'es' ? 'es-CO' : 'de-DE', { day:'numeric', month:'long', year:'numeric' });
}
function fmtDateL(d, l){
  if (!d) return '';
  const [y,m,day] = d.split('-').map(Number);
  return new Date(y, m-1, day).toLocaleDateString(l === 'es' ? 'es-CO' : 'de-DE', { day:'numeric', month:'long' });
}

So geht's:

/* ---------- Routing ---------- */
const view = { name:null, data:null, onLang:null };
function params(){ return new URLSearchParams(location.hash.slice(1)); }

async function route(){
  const p = params();
  view.onLang = null;
  try {
    if (p.get('a')) { view.name = 'admin'; view.data = await rpc('admin_get', { p_admin:p.get('a') }); }
    else if (p.get('p')) {
      view.name = 'me'; view.data = await rpc('me_get', { p_token:p.get('p') });
      store.set('me', p.get('p'));
      if (!store.get('lang:' + p.get('p'))) { lang = view.data.lang || lang; store.set('lang:' + p.get('p'), '1'); store.set('lang', lang); }
      view.onLang = l => rpc('me_update', { p_token:p.get('p'), p_wish:null, p_lang:l }).catch(()=>{});
    }
    else if (p.get('j')) {
      if (store.get('me') && store.get('family') === p.get('j')) { location.hash = 'p=' + store.get('me'); return; }
      store.set('family', p.get('j'));
      view.name = 'join'; view.data = await rpc('family_list', { p_code:p.get('j') });
    }
    else if (store.get('me')) { location.hash = 'p=' + store.get('me'); return; }
    else { view.name = 'home'; view.data = null; }
  } catch(e){
    if (p.get('p') && store.get('me') === p.get('p')) store.set('me', '');
    view.name = 'error'; view.data = errText(e);
  }
  setLang(lang);
}
window.addEventListener('hashchange', route);

function render(){
  ({ admin:renderAdmin, me:renderMe, join:renderJoin, home:renderHome, error:renderError })[view.name || 'home']();
}

        <div id="jerr"></div>
        <button class="btn block" type="submit">${t().join}</button>
      </form>
    </details>`}`;

  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editing = editing === b.dataset.edit ? null : b.dataset.edit; renderAdmin(); });
  app.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { editing = null; renderAdmin(); });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { editing = null; adminDo('admin_remove', { p_id:b.dataset.rm }, t().confirmRemove(byId[b.dataset.rm].name)); });
  const pickTeam = sel => { if (sel.value !== '__new') return sel.value; const v = prompt(t().group); return v === null ? undefined : v; };
  app.querySelectorAll('[data-team]').forEach(s => s.onchange = () => {
    const v = pickTeam(s); if (v === undefined) { renderAdmin(); return; }
    const p = byId[s.dataset.team]; adminDo('admin_set_participant', { p_id:p.id, p_lang:p.lang, p_team:v });
  });
  app.querySelectorAll('[data-lang]').forEach(s => s.onchange = () => {
    const p = byId[s.dataset.lang]; adminDo('admin_set_participant', { p_id:p.id, p_lang:s.value, p_team:p.team || '' });
  });
  if ($('af')) $('af').onsubmit = async (e) => {
    e.preventDefault();
    const team = pickTeam($('at')); if (team === undefined) return;
    try { await rpc('admin_add', { p_admin:params().get('a'), p_name:$('an').value, p_lang:$('al').value, p_team:team }); await reloadAdmin(); }
    catch(err){ toast(errText(err)); }
  };
  app.querySelectorAll('[data-unex]').forEach(b => b.onclick = () => { const [a,c] = b.dataset.unex.split('|'); adminDo('admin_set_exclusion', { p_a:a, p_b:c, p_on:false }); });
  if ($('addEx')) $('addEx').onclick = () => { if ($('xa').value !== $('xb').value) adminDo('admin_set_exclusion', { p_a:$('xa').value, p_b:$('xb').value, p_on:true }); };
  if ($('draw')) $('draw').onclick = async () => { if (await adminDo('admin_draw', {}, t().confirmDraw)) toast(t().drawn); };
  if ($('reset')) $('reset').onclick = () => adminDo('admin_reset_draw', {}, t().confirmReset);
}

route();
</script>
</body>
</html>
